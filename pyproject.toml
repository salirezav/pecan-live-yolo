[project]
name = "pecan-live-yolo"
version = "0.1.0"
description = "Live camera + YOLO (or cascade U-Net) overlay for pecan videos."
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.0",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "pillow>=10.0.0",
    "scipy>=1.14.0",
    "segmentation-models-pytorch>=0.4.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "ultralytics>=8.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
